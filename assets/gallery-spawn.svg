<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" shape-rendering="crispEdges" role="img">
  <title>StormMC spawn town at dawn</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2440"/>
      <stop offset="0.55" stop-color="#4a4f7d"/>
      <stop offset="1" stop-color="#e8926c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- pixel sun -->
  <rect x="560" y="80" width="160" height="160" fill="#ffd98a" opacity="0.16"/>
  <rect x="600" y="120" width="80" height="80" fill="#ffd98a"/>

  <!-- blocky clouds -->
  <g fill="#f2e3d5">
    <rect x="80" y="120" width="160" height="40" opacity="0.75"/>
    <rect x="120" y="80" width="80" height="40" opacity="0.75"/>
    <rect x="480" y="200" width="200" height="40" opacity="0.55"/>
    <rect x="540" y="160" width="100" height="40" opacity="0.55"/>
  </g>

  <!-- distant ridge -->
  <g fill="#2f4a52">
    <rect x="0" y="360" width="800" height="80"/>
    <rect x="60" y="320" width="140" height="40"/>
    <rect x="500" y="330" width="120" height="30"/>
    <rect x="660" y="300" width="140" height="60"/>
  </g>

  <!-- ground -->
  <rect x="0" y="440" width="800" height="40" fill="#3f9e5c"/>
  <rect x="0" y="440" width="800" height="10" fill="#56c076"/>
  <rect x="0" y="480" width="800" height="120" fill="#7a4f2c"/>
  <rect x="0" y="540" width="800" height="60" fill="#664024"/>

  <!-- path -->
  <g fill="#8a8f9a">
    <rect x="360" y="440" width="80" height="40"/>
    <rect x="340" y="480" width="120" height="40"/>
    <rect x="320" y="520" width="160" height="40"/>
    <rect x="300" y="560" width="200" height="40"/>
  </g>

  <!-- house A -->
  <rect x="120" y="360" width="160" height="80" fill="#c99a63"/>
  <rect x="100" y="320" width="200" height="40" fill="#8a4a3a"/>
  <rect x="140" y="280" width="120" height="40" fill="#8a4a3a"/>
  <rect x="180" y="400" width="40" height="40" fill="#5d3a21"/>
  <rect x="140" y="380" width="30" height="30" fill="#ffd88a"/>
  <rect x="230" y="380" width="30" height="30" fill="#ffd88a"/>

  <!-- house B -->
  <rect x="560" y="380" width="120" height="60" fill="#b98a5a"/>
  <rect x="540" y="340" width="160" height="40" fill="#4a5f7a"/>
  <rect x="580" y="395" width="25" height="25" fill="#ffd88a"/>

  <!-- house C -->
  <rect x="690" y="400" width="70" height="40" fill="#c99a63"/>
  <rect x="674" y="370" width="102" height="30" fill="#8a4a3a"/>

  <!-- trees -->
  <rect x="40" y="380" width="30" height="60" fill="#5d3a21"/>
  <rect x="10" y="300" width="90" height="80" fill="#2f7a4a"/>
  <rect x="25" y="270" width="60" height="40" fill="#3f9e5c"/>
  <rect x="440" y="390" width="26" height="50" fill="#5d3a21"/>
  <rect x="410" y="320" width="90" height="70" fill="#2f7a4a"/>
  <rect x="425" y="295" width="60" height="35" fill="#3f9e5c"/>

  <!-- spawn banner -->
  <rect x="300" y="396" width="8" height="44" fill="#8a8f9a"/>
  <rect x="308" y="396" width="36" height="26" fill="#4ade80"/>

  <!-- foreground -->
  <rect x="0" y="572" width="800" height="28" fill="#27633c"/>
</svg>
