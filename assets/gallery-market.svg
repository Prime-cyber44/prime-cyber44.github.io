  <g>
    <rect x="104" y="364" width="20" height="16" fill="#d94f4f"/>
    <rect x="134" y="364" width="20" height="16" fill="#4ade80"/>
    <rect x="164" y="364" width="20" height="16" fill="#ffd35a"/>
    <rect x="194" y="364" width="20" height="16" fill="#d94f4f"/>
  </g>

  <!-- stall B -->
  <rect x="400" y="370" width="220" height="40" fill="#8a5a3a"/>
  <rect x="412" y="410" width="18" height="30" fill="#6b4526"/>
  <rect x="594" y="410" width="18" height="30" fill="#6b4526"/>
  <g>
    <rect x="390" y="300" width="36" height="26" fill="#4a7fd9"/>
    <rect x="426" y="300" width="36" height="26" fill="#eef3f8"/>
    <rect x="462" y="300" width="36" height="26" fill="#4a7fd9"/>
    <rect x="498" y="300" width="36" height="26" fill="#eef3f8"/>
    <rect x="534" y="300" width="36" height="26" fill="#4a7fd9"/>
    <rect x="570" y="300" width="36" height="26" fill="#eef3f8"/>
    <rect x="396" y="326" width="8" height="44" fill="#6b4526"/>
