  <rect x="340" y="300" width="8" height="140" fill="#5d3a21"/>
  <rect x="322" y="316" width="44" height="44" fill="#ffd35a" opacity="0.22"/>
  <rect x="330" y="322" width="28" height="30" fill="#ffd35a"/>
  <rect x="334" y="316" width="20" height="8" fill="#5d3a21"/>

  <!-- stall C partial -->
  <rect x="660" y="390" width="140" height="36" fill="#8a5a3a"/>
  <g>
    <rect x="654" y="334" width="36" height="24" fill="#d94f4f"/>
    <rect x="690" y="334" width="36" height="24" fill="#f0e6d2"/>
    <rect x="726" y="334" width="36" height="24" fill="#d94f4f"/>
    <rect x="762" y="334" width="36" height="24" fill="#f0e6d2"/>
    <rect x="660" y="358" width="8" height="32" fill="#6b4526"/>
    <rect x="788" y="358" width="8" height="32" fill="#6b4526"/>
