<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" shape-rendering="crispEdges" role="img">
  <title>Player market district with stalls and lanterns at sunset</title>
  <defs>
    <linearGradient id="msky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7c173"/>
      <stop offset="0.6" stop-color="#e78a4e"/>
      <stop offset="1" stop-color="#d96a4a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#msky)"/>

  <rect x="40" y="60" width="70" height="70" fill="#fff0b0"/>

  <g fill="#ffe6c4">
    <rect x="200" y="100" width="180" height="40" opacity="0.7"/>
    <rect x="250" y="60" width="90" height="40" opacity="0.7"/>
    <rect x="560" y="160" width="160" height="40" opacity="0.6"/>
    <rect x="600" y="120" width="80" height="40" opacity="0.6"/>
  </g>

  <!-- back trees -->
  <rect x="30" y="370" width="50" height="70" fill="#2f5d3f"/>
  <rect x="720" y="360" width="60" height="80" fill="#2f5d3f"/>

  <!-- ground -->
  <rect x="0" y="440" width="800" height="160" fill="#6e7684"/>
  <g fill="#5c6371">
    <rect x="0" y="470" width="800" height="4"/>
    <rect x="0" y="510" width="800" height="4"/>
    <rect x="0" y="550" width="800" height="4"/>
    <rect x="120" y="474" width="4" height="36"/>
    <rect x="360" y="474" width="4" height="36"/>
    <rect x="600" y="474" width="4" height="36"/>
    <rect x="240" y="514" width="4" height="36"/>
    <rect x="520" y="514" width="4" height="36"/>
  </g>

  <!-- stall A -->
  <rect x="90" y="380" width="180" height="40" fill="#8a5a3a"/>
  <rect x="100" y="420" width="18" height="20" fill="#6b4526"/>
  <rect x="244" y="420" width="18" height="20" fill="#6b4526"/>
  <g>
    <rect x="80" y="318" width="34" height="26" fill="#d94f4f"/>
    <rect x="114" y="318" width="34" height="26" fill="#f0e6d2"/>
    <rect x="148" y="318" width="34" height="26" fill="#d94f4f"/>
    <rect x="182" y="318" width="34" height="26" fill="#f0e6d2"/>
    <rect x="216" y="318" width="34" height="26" fill="#d94f4f"/>
    <rect x="86" y="344" width="8" height="36" fill="#6b4526"/>
    <rect x="266" y="344" width="8" height="36" fill="#6b4526"/>
