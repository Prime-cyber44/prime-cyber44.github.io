<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" shape-rendering="crispEdges" role="img">
  <title>Raid arena lit by fire pits at night</title>
  <defs>
    <linearGradient id="asky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#16203a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#asky)"/>

  <!-- stars -->
  <g fill="#e8edf4" opacity="0.85">
    <rect x="60" y="60" width="6" height="6"/>
    <rect x="150" y="120" width="6" height="6"/>
    <rect x="240" y="50" width="6" height="6"/>
    <rect x="330" y="140" width="6" height="6"/>
    <rect x="420" y="70" width="6" height="6"/>
    <rect x="510" y="180" width="6" height="6"/>
    <rect x="120" y="210" width="6" height="6"/>
    <rect x="700" y="230" width="6" height="6"/>
    <rect x="60" y="300" width="6" height="6"/>
  </g>
  <rect x="630" y="70" width="70" height="70" fill="#e8edf4"/>
  <rect x="650" y="90" width="20" height="20" fill="#c8d2e0"/>

  <!-- ground -->
  <rect x="0" y="470" width="800" height="40" fill="#1c4230"/>
  <rect x="0" y="470" width="800" height="8" fill="#2a5e44"/>
  <rect x="0" y="510" width="800" height="90" fill="#3a2a1c"/>

  <!-- arena rings -->
  <rect x="60" y="300" width="680" height="40" fill="#9aa3ad"/>
  <rect x="40" y="340" width="720" height="40" fill="#868f9c"/>
  <rect x="20" y="380" width="760" height="40" fill="#6e7684"/>
  <rect x="0" y="420" width="800" height="50" fill="#565d6b"/>

  <!-- seams -->
  <g fill="#4a5260" opacity="0.7">
    <rect x="160" y="340" width="4" height="40"/>
    <rect x="320" y="340" width="4" height="40"/>
    <rect x="480" y="340" width="4" height="40"/>
    <rect x="640" y="340" width="4" height="40"/>
    <rect x="100" y="380" width="4" height="40"/>
    <rect x="300" y="380" width="4" height="40"/>
    <rect x="500" y="380" width="4" height="40"/>
    <rect x="700" y="380" width="4" height="40"/>
  </g>

  <!-- battlements -->
  <g fill="#9aa3ad">
    <rect x="60" y="280" width="40" height="20"/>
    <rect x="140" y="280" width="40" height="20"/>
    <rect x="220" y="280" width="40" height="20"/>
    <rect x="300" y="280" width="40" height="20"/>
    <rect x="460" y="280" width="40" height="20"/>
    <rect x="540" y="280" width="40" height="20"/>
    <rect x="620" y="280" width="40" height="20"/>
    <rect x="700" y="280" width="40" height="20"/>
  </g>

  <!-- crowd -->
  <g>
    <rect x="76" y="286" width="14" height="14" fill="#7c8ba1"/>
    <rect x="156" y="286" width="14" height="14" fill="#4ade80"/>
    <rect x="236" y="286" width="14" height="14" fill="#a7b3c4"/>
    <rect x="316" y="286" width="14" height="14" fill="#7c8ba1"/>
    <rect x="476" y="286" width="14" height="14" fill="#fde047"/>
    <rect x="556" y="286" width="14" height="14" fill="#a7b3c4"/>
    <rect x="636" y="286" width="14" height="14" fill="#7c8ba1"/>
    <rect x="716" y="286" width="14" height="14" fill="#4ade80"/>
  </g>

  <!-- entrance -->
  <rect x="340" y="360" width="120" height="110" fill="#0e141c"/>
  <rect x="360" y="340" width="80" height="24" fill="#0e141c"/>

  <!-- banners -->
  <rect x="100" y="340" width="36" height="64" fill="#d94f4f"/>
  <rect x="112" y="356" width="12" height="24" fill="#fde047"/>
  <rect x="664" y="340" width="36" height="64" fill="#d94f4f"/>
  <rect x="676" y="356" width="12" height="24" fill="#fde047"/>

  <!-- fire pits -->
  <g>
    <rect x="280" y="476" width="40" height="30" fill="#565d6b"/>
    <rect x="282" y="452" width="36" height="26" fill="#ff8a1f"/>
    <rect x="288" y="440" width="24" height="18" fill="#ffd35a"/>
    <rect x="480" y="476" width="40" height="30" fill="#565d6b"/>
    <rect x="482" y="452" width="36" height="26" fill="#ff8a1f"/>
    <rect x="488" y="440" width="24" height="18" fill="#ffd35a"/>
  </g>
</svg>
