<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" shape-rendering="crispEdges" role="img">
  <title>The storm tower taking a lightning strike</title>
  <defs>
    <linearGradient id="ssky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1424"/>
      <stop offset="0.6" stop-color="#1d2740"/>
      <stop offset="1" stop-color="#10151f"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#ssky)"/>

  <!-- storm front -->
  <g fill="#111827">
    <rect x="0" y="0" width="800" height="56"/>
    <rect x="40" y="56" width="240" height="60" fill="#161f31"/>
    <rect x="260" y="40" width="200" height="80" fill="#1a2437"/>
    <rect x="440" y="70" width="320" height="60" fill="#141c2c"/>
    <rect x="600" y="40" width="200" height="80" fill="#1a2437"/>
  </g>

  <!-- rain -->
  <g fill="#5aa9ff" opacity="0.42" transform="rotate(-8 400 300)">
    <rect x="60" y="180" width="6" height="76"/>
    <rect x="140" y="260" width="6" height="76"/>
    <rect x="220" y="150" width="6" height="76"/>
    <rect x="300" y="300" width="6" height="76"/>
    <rect x="380" y="170" width="6" height="76"/>
    <rect x="500" y="250" width="6" height="76"/>
    <rect x="560" y="140" width="6" height="76"/>
    <rect x="640" y="300" width="6" height="76"/>
    <rect x="720" y="200" width="6" height="76"/>
    <rect x="760" y="340" width="6" height="76"/>
  </g>

  <!-- lightning -->
  <g filter="url(#glow)">
    <path fill="#fde047" transform="translate(330 60) scale(9)"
          d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z"/>
    <path fill="#fde047" opacity="0.75" transform="translate(90 90) scale(4.5)"
          d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z"/>
  </g>

  <!-- ground -->
  <rect x="0" y="470" width="800" height="40" fill="#1f5137"/>
  <rect x="0" y="470" width="800" height="8" fill="#2f7a4a"/>
  <rect x="0" y="510" width="800" height="90" fill="#4a3220"/>

  <!-- strike light on ground -->
  <rect x="280" y="464" width="240" height="14" fill="#fde047" opacity="0.35"/>

  <!-- tower -->
  <rect x="340" y="240" width="120" height="230" fill="#7f8996"/>
  <rect x="340" y="300" width="120" height="6" fill="#67707d"/>
  <rect x="340" y="360" width="120" height="6" fill="#67707d"/>
  <rect x="340" y="420" width="120" height="6" fill="#67707d"/>
  <rect x="396" y="240" width="6" height="230" fill="#67707d"/>
  <rect x="370" y="330" width="30" height="40" fill="#0e1424"/>
  <rect x="376" y="338" width="18" height="26" fill="#ffd35a"/>
  <rect x="370" y="410" width="30" height="40" fill="#0e1424"/>
  <rect x="376" y="418" width="18" height="26" fill="#ffd35a"/>

  <!-- roof -->
  <rect x="320" y="200" width="160" height="40" fill="#b23c3c"/>
  <rect x="348" y="160" width="104" height="40" fill="#c94f4f"/>
  <rect x="392" y="128" width="16" height="32" fill="#8a8f9a"/>
  <rect x="388" y="120" width="24" height="12" fill="#fde047"/>

  <!-- small trees -->
  <rect x="150" y="440" width="40" height="30" fill="#163b28"/>
  <rect x="162" y="416" width="16" height="24" fill="#163b28"/>
  <rect x="620" y="436" width="50" height="34" fill="#163b28"/>
  <rect x="638" y="410" width="16" height="26" fill="#163b28"/>
</svg>
